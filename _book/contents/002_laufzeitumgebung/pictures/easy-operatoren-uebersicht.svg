<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="520"
  viewBox="0 0 1600 520"
  role="img"
  aria-label="Übersicht: Zusammenspiel der Operatoren und Ressourcen im EASY Kubernetes Cluster"
>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      markerUnits="userSpaceOnUse"
      orient="auto"
    >
      <path
        d="M 0 0 L 10 5 L 0 10 z"
        fill="#000000"
        stroke="#000000"
        stroke-miterlimit="10"
      />
    </marker>
    <style>
      .bg {
        fill: #ffffff;
      }
      .cr {
        fill: #fff7d6;
        stroke: #333;
        stroke-width: 2;
      }
      .op {
        fill: #d6ecff;
        stroke: #333;
        stroke-width: 2;
      }
      .k8s {
        fill: #f3f3f3;
        stroke: #333;
        stroke-width: 2;
      }
      .kafka {
        fill: #dff7df;
        stroke: #333;
        stroke-width: 2;
      }
      .arrow {
        stroke: #000000;
        stroke-width: 2;
        fill: none;
        stroke-miterlimit: 10;
        marker-end: url(#arrow);
      }
      text {
        font-family: "IBM Plex Sans", Arial, sans-serif;
        fill: #111;
        font-size: 16px;
      }
      .small {
        font-size: 13px;
        fill: #333;
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="520" />

  <!-- Custom Resources -->
  <rect class="cr" x="40" y="228" width="190" height="64" rx="12" />
  <text x="135" y="252" text-anchor="middle">DataProcess</text>
  <text class="small" x="135" y="274" text-anchor="middle">(Custom Resource)</text>

  <rect class="cr" x="560" y="60" width="190" height="64" rx="12" />
  <text x="655" y="84" text-anchor="middle">DataRoute</text>
  <text class="small" x="655" y="106" text-anchor="middle">(Custom Resource)</text>

  <rect class="cr" x="560" y="228" width="190" height="64" rx="12" />
  <text x="655" y="252" text-anchor="middle">Bot</text>
  <text class="small" x="655" y="274" text-anchor="middle">(Custom Resource)</text>

  <rect class="cr" x="560" y="396" width="190" height="64" rx="12" />
  <text x="655" y="420" text-anchor="middle">KafkaTopic</text>
  <text class="small" x="655" y="442" text-anchor="middle">(Custom Resource)</text>

  <rect class="cr" x="890" y="140" width="190" height="64" rx="12" />
  <text x="985" y="164" text-anchor="middle">BotTask</text>
  <text class="small" x="985" y="186" text-anchor="middle">(Custom Resource)</text>

  <rect class="cr" x="890" y="316" width="190" height="64" rx="12" />
  <text x="985" y="340" text-anchor="middle">BotDeployment</text>
  <text class="small" x="985" y="362" text-anchor="middle">(Custom Resource)</text>

  <!-- Operators -->
  <rect class="op" x="270" y="228" width="240" height="64" rx="12" />
  <text x="390" y="260" text-anchor="middle">DataProcessOperator</text>

  <rect class="op" x="820" y="60" width="240" height="64" rx="12" />
  <text x="940" y="92" text-anchor="middle">DataRouterOperator</text>

  <rect class="op" x="820" y="228" width="240" height="64" rx="12" />
  <text x="940" y="260" text-anchor="middle">BotOperator</text>

  <rect class="op" x="1100" y="160" width="240" height="64" rx="12" />
  <text x="1220" y="192" text-anchor="middle">BotTasksOperator</text>

  <rect class="op" x="1100" y="296" width="240" height="64" rx="12" />
  <text x="1220" y="328" text-anchor="middle">BotDeploymentOperator</text>

  <rect class="op" x="820" y="396" width="240" height="64" rx="12" />
  <text x="940" y="420" text-anchor="middle">Kafka Operator</text>
  <text class="small" x="940" y="442" text-anchor="middle">(z.B. Strimzi)</text>

  <!-- Materialisierte / Laufzeit-Ressourcen -->
  <rect class="k8s" x="1100" y="60" width="300" height="64" rx="12" />
  <text x="1250" y="84" text-anchor="middle">DataRouter</text>
  <text class="small" x="1250" y="106" text-anchor="middle">Deployment + ConfigMap</text>

  <rect class="k8s" x="1370" y="160" width="190" height="64" rx="12" />
  <text x="1465" y="184" text-anchor="middle">ConfigMap</text>
  <text class="small" x="1465" y="206" text-anchor="middle">aus BotTask</text>

  <rect class="k8s" x="1370" y="296" width="190" height="64" rx="12" />
  <text x="1465" y="320" text-anchor="middle">Bot Runtime</text>
  <text class="small" x="1465" y="342" text-anchor="middle">Node-RED Flow / Deployment</text>

  <rect class="kafka" x="1100" y="396" width="300" height="64" rx="12" />
  <text x="1250" y="428" text-anchor="middle">Kafka Topics</text>

  <!-- Kanten -->
  <path class="arrow" d="M 230 260 L 270 260" />

  <path class="arrow" d="M 510 240 L 560 92" />
  <path class="arrow" d="M 510 260 L 560 260" />
  <path class="arrow" d="M 510 280 L 560 428" />

  <path class="arrow" d="M 750 92 L 820 92" />
  <path class="arrow" d="M 1060 92 L 1100 92" />

  <path class="arrow" d="M 750 260 L 820 260" />

  <path class="arrow" d="M 960 228 L 1005 204" />
  <path class="arrow" d="M 1080 172 L 1100 192" />
  <path class="arrow" d="M 1340 192 L 1370 192" />

  <path class="arrow" d="M 960 292 L 1005 316" />
  <path class="arrow" d="M 1080 348 L 1100 328" />
  <path class="arrow" d="M 1340 328 L 1370 328" />

  <path class="arrow" d="M 750 428 L 820 428" />
  <path class="arrow" d="M 1060 428 L 1100 428" />

  <!-- Legende -->
  <rect class="cr" x="40" y="486" width="18" height="18" rx="4" />
  <text class="small" x="66" y="500">Custom Resource (CR)</text>

  <rect class="op" x="260" y="486" width="18" height="18" rx="4" />
  <text class="small" x="286" y="500">Operator</text>

  <rect class="k8s" x="400" y="486" width="18" height="18" rx="4" />
  <text class="small" x="426" y="500">Kubernetes Ressource</text>

  <rect class="kafka" x="610" y="486" width="18" height="18" rx="4" />
  <text class="small" x="636" y="500">Kafka</text>
</svg>
