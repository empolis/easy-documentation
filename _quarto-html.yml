project:
  type: book
  output-dir: _book
  preview:
    browser: true
    navigate: true
lang: de
book:
  # title in document
  title: |
    EASY - 
    Energieeffiziente Analyse- und Steuerungsprozesse 
    im dynamischen Edge-Cloud-Kontinuum
    für die industrielle Fertigung
  subtitle: "Dokumentation des EASY-Projektes"
  # output filename
  output-file: "EASY-Dokumentation"
  search: true
  repo-url: https://github.com/empolis/easy-documentation
  repo-actions: []
  downloads: [pdf]
  cover-image: pictures/Logos/EASY-Logo-Schwarz.png
