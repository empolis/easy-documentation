    logo: pictures/Logos/EASY-Logo-Schwarz.png
    
format:

  html:
    pagetitle: "EASY Dokumentation"
    mainfont: IBM Plex Sans
    theme: [custom.scss, cosmo]
    cover-image: pictures/Logos/EASY-Logo-Schwarz.png
    number-depth: 6
    toc: true
    toc-depth: 4
    lof: false
    lot: false
    top-level-division: chapter
    latex-engine: xelatex
    number-sections: false
    keep-tex: true
    citation-package: natbib
    fig-caption: true
    link-external-newwindow: true
    css: styles.css
    include-after-body:
      text: |
        <script>
          document.title = "EASY Dokumentation";
        </script>

  titlepage-pdf:
    mainfont: IBM Plex Sans
    documentclass: report
    number-sections: true
    number-depth: 6
    toc: true
    toc-depth: 4
    cover-image: pictures/Logos/EASY-Logo-Schwarz.png
    link-citations: true
    titlepage-fontfamily: "IBM Plex Sans"
    titlepage-logo: "pictures/Logos/EASY-Logo-Schwarz.png"
    logo-size: 20
    logo-align: center
    titlepage: "formal"
    titlepage-footer: |
      19.06.2026 \
      Version v3.2 \
    # [https://gitlab.empolis.com/industrial-analytics/easy/easy-documentation](https://gitlab.empolis.com/industrial-analytics/easy/easy-documentation)\
    include-in-header:
      text: |
        \usepackage{fontspec}
        \setmainfont{IBM Plex Sans}
    titlepage-theme:
      elements: ["\\titleblock", "\\authorblock", "\\affiliationblock", "\\vfill", "\\logoblock", "\\footerblock"]
      page-align: "center"
      title-style: "plain"
      #title-fontstyle: ["Huge", "textbf"]
      title-space-after: "1.5cm"
      subtitle-fontstyle: "LARGE"
      title-subtitle-space-between: "0.5cm"
      author-style: "superscript"
      author-fontstyle: "small"
      author-sep: ", "
      #author-fontstyle: "textbf"
      #author-space-after: "2\\baselineskip"
      affiliation-style: "numbered-list"
      affiliation-fontstyle: "small"
      affiliation-space-after: "0pt"
      footer-style: "plain"
      footer-fontstyle: ["Large", "textsc"]
      footer-space-after: "0pt"
      logo-size: "0.4\\textwidth"
      logo-space-after: "1cm"

