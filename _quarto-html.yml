  navbar:
    pinned: false
    collapse: true
    back-to-top-navigation: true
    logo: pictures/Logos/EASY-Logo-Schwarz.png
    right:
      - icon: linkedin
        href: https://www.linkedin.com/company/empolis/
        aria-label: LinkedIn
        target: _blank
  # kleines Logo in Browser-Tab
  favicon: pictures/Logos/favicon.ico

  chapters:
    - index.qmd

